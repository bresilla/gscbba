name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify
        run: |
          nix develop --command bash -euc '
            ruff format --check .
            ruff check .
            python -m pytest
            python -m gscbba --help
            python -m build --no-isolation
          '
