[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gscbba"
version = "0.1.0"
description = "Event-triggered row allocation and simulation for harvester teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<0.14",
  "pulp>=3.2,<4",
]

[project.urls]
Repository = "https://github.com/bresilla/gscbba"
Issues = "https://github.com/bresilla/gscbba/issues"

[project.scripts]
gscbba = "gscbba.__main__:main"

[dependency-groups]
dev = ["build", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/gscbba"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/results",
  "/figures",
  "/README.md",
  "/CITATION.cff",
  "/CITATION.bib",
  "/pyproject.toml",
  "/requirements.txt",
  "/flake.nix",
  "/flake.lock",
  "/.env.lua",
  "/.make.lua",
  "/.wing.toml",
  "/.gitignore",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
